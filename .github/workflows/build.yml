name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        configuration: [downloaded-gtest, system-gtest, no-tests, installed-bpdpvs]
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git libgmp-dev
          if [ "${{ matrix.configuration }}" = "system-gtest" ] || [ "${{ matrix.configuration }}" = "installed-bpdpvs" ]; then
            sudo apt-get install -y libgtest-dev
          fi
      - name: Install bp-dpvs in a temporary prefix
        if: matrix.configuration == 'installed-bpdpvs'
        run: |
          prefix="$RUNNER_TEMP/openfe-deps"
          cmake -S . -B seed -DBUILD_TESTING=OFF
          cmake --build seed --target relic_project --parallel 4
          cmake --install seed/relic-build --prefix "$prefix"
          cmake -S seed/_deps/bpdpvs-src -B bpdpvs-build \
            -DCMAKE_PREFIX_PATH="$prefix" -DCMAKE_INSTALL_PREFIX="$prefix" -DBUILD_MAIN=OFF
          cmake --build bpdpvs-build --parallel 4
          cmake --install bpdpvs-build
      - name: Configure
        run: |
          case "${{ matrix.configuration }}" in
            downloaded-gtest)
              cmake -S . -B build -DCMAKE_DISABLE_FIND_PACKAGE_GTest=ON
              test -d build/_deps/googletest-src
              ;;
            system-gtest)
              gtest_config="$(dpkg -L libgtest-dev | grep '/GTestConfig.cmake$')"
              cmake -S . -B build -DGTest_DIR="$(dirname "$gtest_config")"
              grep -q '^GTest_DIR:PATH=/usr/' build/CMakeCache.txt
              ;;
            no-tests)
              cmake -S . -B build -DBUILD_TESTING=OFF
              test ! -d build/_deps/googletest-src
              ;;
            installed-bpdpvs)
              cmake -S . -B build -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/openfe-deps"
              grep -Fq "bpdpvs_DIR:PATH=$RUNNER_TEMP/openfe-deps/" build/CMakeCache.txt
              test ! -d build/_deps/bpdpvs-src
              ;;
          esac
      - name: Build
        run: cmake --build build --parallel 4
      - name: Test
        if: matrix.configuration != 'no-tests'
        run: ctest --test-dir build --output-on-failure --no-tests=error
